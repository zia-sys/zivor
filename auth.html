<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up / Sign In — ZIVOR</title><meta name="description" content="Create your ZIVOR account or sign in to continue."><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.min.js"></script><style>:root{--bg:#070b14;--text:#f5f7fb;--muted:#9da8bb;--line:rgba(255,255,255,.09);--a:#7c5cff;--a2:#25c7ff;--max:500px}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 80% 10%,rgba(124,92,255,.22),transparent 30%),radial-gradient(circle at 10% 80%,rgba(37,199,255,.12),transparent 28%),var(--bg);color:var(--text);display:grid;place-items:center;padding:28px}.auth-wrap{width:min(var(--max),100%)}.brand{text-align:center;font-weight:900;font-size:25px;letter-spacing:-.05em;margin-bottom:28px}.brand span{color:var(--a2)}.auth-card{padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.045);box-shadow:0 30px 90px rgba(0,0,0,.4)}h1{font-size:34px;letter-spacing:-.045em}.sub{color:var(--muted);font-size:14px;margin:8px 0 24px}.field{margin:14px 0}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#080d18;color:#fff;outline:none}input:focus{border-color:rgba(124,92,255,.75);box-shadow:0 0 0 3px rgba(124,92,255,.1)}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-weight:900;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.6;cursor:not-allowed}.switch{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}.linkbtn,.forgot{background:none;border:0;color:#8fe8ff;font-weight:800;cursor:pointer}.forgot{display:inline-flex;font-size:12px;margin-top:10px}.msg{min-height:22px;text-align:center;color:#9da8bb;font-size:12px;margin-top:14px}.note{font-size:11px;color:#778399;margin-top:12px}.legal{text-align:center;color:#778399;font-size:11px;margin-top:18px}.legal a{color:#8fe8ff;text-decoration:none}</style></head><body><main class="auth-wrap"><div class="brand">ZIVOR<span>.</span></div><section class="auth-card"><h1 id="authTitle">Create your ZIVOR account</h1><p id="authSubtitle" class="sub">Sign up with your email and password to continue to the website.</p><form id="authForm"><div id="nameWrap" class="field"><label for="authName">Name</label><input id="authName" autocomplete="name" placeholder="Your name"></div><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="authPassword">Password</label><input id="authPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div><div id="confirmWrap" class="field"><label>Confirm Password</label><input id="authConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password"></div><div id="modeNote" class="note">Password must be at least 8 characters.</div><button id="authSubmit" class="btn" type="submit">Create Account</button><button id="forgotPassword" class="forgot" type="button">Forgot password?</button><div id="authMessage" class="msg" aria-live="polite"></div></form><div class="switch"><span id="authSwitchText">Already have an account?</span> <button id="authSwitch" class="linkbtn" type="button">Sign In</button></div><div class="legal">By continuing, you agree to our <a href="privacy.html">Privacy Policy</a>.</div></section></main><script src="auth.js"></script><script src="site.js"></script></body></html>
